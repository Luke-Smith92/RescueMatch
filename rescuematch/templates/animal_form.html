{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }} | RescueMatch</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'browse' %}">Browse Animals</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'manage_animals' %}">Manage Animals</a>
    </nav>

    <main class="form-container">
        <h1>{{ page_title }}</h1>

        <form method="POST" enctype="multipart/form-data" class="animal-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn primary-btn">{{ button_text }}</button>
            <a href="{% url 'manage_animals' %}" class="btn">Cancel</a>
        </form>
    </main>

</body>
</html>
